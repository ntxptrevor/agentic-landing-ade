; PHP settings for BidForge (Hostinger reads .user.ini per directory).
upload_max_filesize = 64M
post_max_size = 70M
max_file_uploads = 50
memory_limit = 256M
; Never print errors (paths, stack traces) to visitors; log them instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
